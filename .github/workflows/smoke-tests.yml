name: Smoke tests

on:
  push:
    paths:
      - "tap_7shifts/**"
      - "__smoke-tests__/**"
      - "pyproject.toml"
      - ".github/workflows/smoke-tests.yml"
  pull_request:
    paths:
      - "tap_7shifts/**"
      - "__smoke-tests__/**"
      - "pyproject.toml"
      - ".github/workflows/smoke-tests.yml"

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tap and smoke-test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . hotglue-smoke-test

      - name: Run recorded smoke tests
        run: |
          hotglue-smoke-test run companies_test
          hotglue-smoke-test run departments_test
          hotglue-smoke-test run locations_test
          hotglue-smoke-test run roles_test
          hotglue-smoke-test run shifts_test
          hotglue-smoke-test run time_punches_test
          hotglue-smoke-test run users_test
